[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-aiops"
version = "2.7.0"
description = "Multimodal AIOps & Root Cause Intelligence Platform"
readme = "README.md"
authors = [{ name = "Alok Agarwal" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "huggingface_hub>=0.22.0",
    "torch>=2.2.0",
    "scipy>=1.11.0",
    "redis>=5.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008", "B905"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pyrefly]
search-path = [".", "backend", "ml_engine"]
site-package-path = ["C:/Users/Alok Agarwal/AppData/Local/Programs/Python/Python314/Lib/site-packages"]
python-interpreter-path = "C:/Users/Alok Agarwal/AppData/Local/Programs/Python/Python314/python.exe"

[tool.pyrefly.errors]
missing-source-for-stubs = "ignore"
unnecessary-type-conversion = "ignore"
missing-source = "ignore"
missing-import = "ignore"



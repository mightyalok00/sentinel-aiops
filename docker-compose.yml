version: '3.8'

services:
  sentinel-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-ai-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - ARTIFACTS_DIR=/app/artifacts
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:


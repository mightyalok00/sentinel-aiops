name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov httpx bandit

      - name: Seed Test Data Fixture
        run: |
          mkdir -p data/rcaeval/re1ob_adservice_cpu_1
          echo '1600000000' > data/rcaeval/re1ob_adservice_cpu_1/inject_time.txt
          echo '[{"time": 1600000000.0, "adservice_cpu": 0.85, "cartservice_cpu": 0.20}]' > data/rcaeval/re1ob_adservice_cpu_1/metrics.json

      - name: Lint with Ruff
        run: |
          ruff check . --ignore E501

      - name: Security Audit with Bandit
        run: |
          bandit -r backend/ ml_engine/ -ll -q

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v --cov=backend --cov=ml_engine
